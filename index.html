<style>
  :root{
    --ink:#12181f;
    --paper:#f6f4ef;
    --tagger:#d1352f;
    --tagger-dark:#8f221e;
    --runner:#1f6fb2;
    --runner-dark:#144a78;
    --amber:#c9862a;
    --line:#dcd7cb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---- Setup screen ---- */
  #setup{
    position:fixed; inset:0; z-index:2000;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#141a21,#1c2530);
    padding:20px;
  }
  #setup .card{
    width:100%; max-width:360px;
    background:var(--paper);
    border-radius:14px;
    padding:28px 26px 24px;
    box-shadow:0 30px 60px rgba(0,0,0,.4);
  }
  #setup h1{
    font-size:22px; letter-spacing:.5px; margin:0 0 2px;
    font-weight:800;
  }
  #setup h1 span{color:var(--tagger);}
  #setup p.sub{margin:0 0 20px; font-size:13px; color:#6b6455;}
  label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#8a8272; margin:16px 0 6px;}
  input[type=text]{
    width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid var(--line);
    font-size:15px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--amber); border-color:var(--amber);}
  .role-toggle{display:flex; gap:10px; margin-top:6px;}
  .role-btn{
    flex:1; padding:14px 8px; border-radius:10px; border:2px solid var(--line);
    background:#fff; cursor:pointer; font-weight:700; font-size:14px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:.15s;
  }
  .role-btn small{font-weight:500; font-size:11px; color:#8a8272;}
  .role-btn.active[data-role="tagger"]{border-color:var(--tagger); background:#fdeceb; color:var(--tagger-dark);}
  .role-btn.active[data-role="runner"]{border-color:var(--runner); background:#eaf3fb; color:var(--runner-dark);}
  #startBtn{
    width:100%; margin-top:22px; padding:13px; border:none; border-radius:9px;
    background:var(--ink); color:#fff; font-weight:800; font-size:15px; letter-spacing:.3px;
    cursor:pointer;
  }
  #startBtn:disabled{opacity:.4; cursor:not-allowed;}
  #setupError{color:var(--tagger-dark); font-size:12.5px; margin-top:10px; min-height:14px;}

  /* ---- Map + HUD ---- */
  #map{position:fixed; inset:0;}
  #hud{
    position:fixed; top:12px; left:12px; right:12px; z-index:1000;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; pointer-events:none;
  }
  .panel{
    background:rgba(246,244,239,.96); border-radius:12px; padding:10px 14px;
    box-shadow:0 6px 18px rgba(0,0,0,.18); pointer-events:auto;
    font-size:12.5px; line-height:1.5;
  }
  #mePanel b{font-size:14px;}
  .pill{
    display:inline-block; padding:2px 9px; border-radius:20px; font-weight:800;
    font-size:10.5px; letter-spacing:.4px; text-transform:uppercase; margin-left:6px;
  }
  .pill.tagger{background:var(--tagger); color:#fff;}
  .pill.runner{background:var(--runner); color:#fff;}
  #boundsStatus{font-weight:700; margin-top:4px;}
  #boundsStatus.in{color:#2e7d32;}
  #boundsStatus.out{color:var(--tagger-dark);}
  #nextPush{color:#6b6455;}
  #legend{
    position:fixed; bottom:14px; left:12px; z-index:1000;
    background:rgba(246,244,239,.96); border-radius:10px; padding:8px 12px;
    font-size:11.5px; box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  #legend div{display:flex; align-items:center; gap:6px; margin:3px 0;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.2);}
  .dot.me{background:var(--amber);}
  .dot.tagger{background:var(--tagger);}
  .dot.runner{background:var(--runner);}
  .dashline{width:16px; border-top:3px solid var(--tagger); display:inline-block;}

  #styleSwitch{
    position:fixed; bottom:14px; right:12px; z-index:1000;
    display:flex; background:rgba(246,244,239,.96); border-radius:10px; padding:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.18); gap:3px;
  }
  .style-btn{
    border:none; background:transparent; padding:6px 11px; border-radius:7px;
    font-size:11.5px; font-weight:700; color:#6b6455; cursor:pointer;
  }
  .style-btn.active{background:var(--ink); color:#fff;}

  .leaflet-popup-content{font-size:12.5px; margin:8px 10px;}
  .leaflet-popup-content b{font-size:13px;}
</style>
</head>
<body>

<div id="setup">
  <div class="card">
    <h1>City <span>Tag</span></h1>
    <p class="sub">Melbourne CBD · live location, blipped on a timer</p>

    <label for="nameInput">Your name</label>
    <input id="nameInput" type="text" placeholder="e.g. Jess" maxlength="20" autocomplete="off">

    <label>Your role</label>
    <div class="role-toggle">
      <button class="role-btn active" data-role="tagger" type="button">
        Tagger
        <small>see runners every 5m</small>
      </button>
      <button class="role-btn" data-role="runner" type="button">
        Runner
        <small>see taggers every 10m</small>
      </button>
    </div>

    <button id="startBtn">Enter the grid</button>
    <div id="setupError"></div>
  </div>
</div>

<div id="map"></div>

<div id="hud" style="display:none;">
  <div class="panel" id="mePanel">
    <b id="meName">—</b><span class="pill" id="mePill">—</span>
    <div id="boundsStatus">checking location…</div>
    <div id="nextPush">next update in —</div>
  </div>
</div>

<div id="legend" style="display:none;">
  <div><span class="dot me"></span> You</div>
  <div><span class="dot tagger"></span> Taggers</div>
  <div><span class="dot runner"></span> Runners</div>
  <div><span class="dashline"></span> Boundary</div>
</div>

<div id="styleSwitch" style="display:none;">
  <button class="style-btn active" data-style="clean" type="button" onclick="setMapStyle('clean')">Clean</button>
  <button class="style-btn" data-style="standard" type="button" onclick="setMapStyle('standard')">Standard</button>
</div>


<script>
/* ---------- Firebase config ----------
   1. Go to https://console.firebase.google.com -> Add project (free, no card needed)
   2. In the project, click the </> (web app) icon to register a web app
   3. Copy the firebaseConfig object it gives you and paste it below
   4. In the left sidebar go to Build -> Realtime Database -> Create Database
      -> start in TEST MODE (fine for a casual game; anyone with the URL can read/write)
   5. Save this file, re-upload to GitHub, done.
--------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDy9p50I0kokHtfF78-TZqzqrcftYG9O5A",
  authDomain: "city-tag-54d51.firebaseapp.com",
  databaseURL: "https://city-tag-54d51-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "city-tag-54d51",
  storageBucket: "city-tag-54d51.firebasestorage.app",
  messagingSenderId: "207681576477",
  appId: "1:207681576477:web:31971798b44174953130f4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ---------- Boundary: traced from the user's supplied map (approximate — see chat) ---------- */
/* NOTE: this is eyeballed from a screenshot, not survey-accurate. For a precise boundary,
   trace it at https://geojson.io over satellite imagery and swap these coordinates. */
const BOUNDARY = [
  [-37.8073, 144.9399],
  [-37.8017, 144.9447],
  [-37.8013, 144.9585],
  [-37.8053, 144.9627],
  [-37.8017, 144.9675],
  [-37.8037, 144.9751],
  [-37.8077, 144.9965],
  [-37.8193, 144.9965],
  [-37.8245, 144.9889],
  [-37.8277, 144.9924],
  [-37.8325, 144.9875],
  [-37.8365, 144.9765],
  [-37.8369, 144.9613],
  [-37.8357, 144.9475],
  [-37.8253, 144.9475],
  [-37.8197, 144.9378],
  [-37.8125, 144.9365],
];
const CENTER = [-37.8180, 144.9650];

// A big box well beyond the play area — paired with BOUNDARY as a "hole",
// this lets us shade everything OUTSIDE the boundary in red.
const OUTER_RING = [
  [-38.3, 144.3],
  [-38.3, 145.6],
  [-37.3, 145.6],
  [-37.3, 144.3],
];

/* ---------- Timing ---------- */
const PUSH_INTERVAL = { runner: 5 * 60 * 1000, tagger: 10 * 60 * 1000 };
const POLL_INTERVAL = 20 * 1000;       // how often we refresh the map from shared storage
const STALE_AFTER   = 25 * 60 * 1000;  // hide a player if unseen this long

/* ---------- State ---------- */
let myRole = 'tagger';
let myName = '';
let myId = '';
let myCurrentPos = null;    // latest raw GPS reading (kept fresh locally)
let map, boundaryLayer, meMarker;
const otherMarkers = {};    // id -> L.marker
let nextPushAt = 0;

/* ---------- Setup screen wiring ---------- */
document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    myRole = btn.dataset.role;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame(){
  const nameField = document.getElementById('nameInput');
  const err = document.getElementById('setupError');
  myName = nameField.value.trim();
  if(!myName){
    err.textContent = 'Enter a name so others can spot you on the grid.';
    return;
  }
  if(!('geolocation' in navigator)){
    err.textContent = 'This browser has no location support — try a phone browser.';
    return;
  }
  myId = myRole + ':' + myName.toLowerCase().replace(/[^a-z0-9]/g,'') + ':' + Math.random().toString(36).slice(2,6);

  document.getElementById('setup').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('legend').style.display = 'block';
  document.getElementById('styleSwitch').style.display = 'flex';
  document.getElementById('meName').textContent = myName;
  const pill = document.getElementById('mePill');
  pill.textContent = myRole;
  pill.className = 'pill ' + myRole;

  initMap();
  watchLocation();
  scheduleNextPush(true); // push immediately on join
  setInterval(refreshOthers, POLL_INTERVAL);
  setInterval(tickCountdown, 1000);
  refreshOthers();
}

/* ---------- Map ---------- */
let currentBaseLayer;
const BASE_LAYERS = {
  clean: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }),
  standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  })
};

function setMapStyle(style){
  if(currentBaseLayer) map.removeLayer(currentBaseLayer);
  currentBaseLayer = BASE_LAYERS[style];
  currentBaseLayer.addTo(map);
  document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === style));
}

function initMap(){
  map = L.map('map', { zoomControl: true }).setView(CENTER, 15);
  setMapStyle('clean'); // closest free look to Apple Maps' light style

  // Outer ring + inner BOUNDARY ring = a polygon with a hole, so only the
  // "not allowed" area outside the boundary gets the red tint.
  boundaryLayer = L.polygon([OUTER_RING, BOUNDARY], {
    color: '#d1352f', weight: 3, fillColor: '#d1352f', fillOpacity: 0.16
  }).addTo(map);
}

function pointInBoundary(lat, lng){
  // ray-casting, BOUNDARY is [lat,lng] pairs
  let inside = false;
  for(let i=0, j=BOUNDARY.length-1; i<BOUNDARY.length; j=i++){
    const yi = BOUNDARY[i][0], xi = BOUNDARY[i][1];
    const yj = BOUNDARY[j][0], xj = BOUNDARY[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

/* ---------- My live GPS (local only — doesn't push every tick) ---------- */
function watchLocation(){
  navigator.geolocation.watchPosition(
    pos => {
      myCurrentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      drawMe();
    },
    error => {
      document.getElementById('boundsStatus').textContent = 'Location error: ' + error.message;
    },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}

function drawMe(){
  if(!myCurrentPos) return;
  const {lat, lng} = myCurrentPos;
  if(!meMarker){
    meMarker = L.circleMarker([lat,lng], {
      radius: 9, color:'#fff', weight:2, fillColor:'#c9862a', fillOpacity:1
    }).addTo(map).bindPopup('<b>' + myName + '</b> (you)');
    map.setView([lat,lng], 16);
  } else {
    meMarker.setLatLng([lat,lng]);
  }
  const inside = pointInBoundary(lat, lng);
  const statusEl = document.getElementById('boundsStatus');
  statusEl.textContent = inside ? '✅ Inside the boundary' : '⚠️ Outside the boundary!';
  statusEl.className = inside ? 'in' : 'out';
}

/* ---------- Pushing my location on my role's blip interval ---------- */
function scheduleNextPush(immediate){
  const interval = PUSH_INTERVAL[myRole];
  nextPushAt = Date.now() + (immediate ? 0 : interval);
  if(immediate) pushMyLocation();
  setTimeout(function loop(){
    pushMyLocation();
    nextPushAt = Date.now() + interval;
    setTimeout(loop, interval);
  }, interval);
}

async function pushMyLocation(){
  if(!myCurrentPos) return; // wait until we have a GPS fix
  try{
    await db.ref('players/' + myId).set({
      name: myName, role: myRole,
      lat: myCurrentPos.lat, lng: myCurrentPos.lng,
      ts: Date.now()
    });
  }catch(e){ console.error('push failed', e); }
}

/* leave a clean trail: remove my entry if the tab/browser closes */
window.addEventListener('beforeunload', () => {
  if(myId) db.ref('players/' + myId).remove();
});

function tickCountdown(){
  const secs = Math.max(0, Math.round((nextPushAt - Date.now())/1000));
  const m = Math.floor(secs/60), s = secs%60;
  document.getElementById('nextPush').textContent =
    'your next blip in ' + m + 'm ' + String(s).padStart(2,'0') + 's';
}

/* ---------- Reading everyone else from shared storage ---------- */
async function refreshOthers(){
  try{
    const snap = await db.ref('players').once('value');
    const all = snap.val();
    if(!all) return;
    const wanted = myRole === 'tagger' ? 'runner' : 'tagger'; // see the opposing role
    const seen = new Set();

    for(const [id, data] of Object.entries(all)){
      const key = 'player:' + id;
      if(id === myId) continue;
      if(!data || data.role !== wanted) continue;
      if(Date.now() - data.ts > STALE_AFTER) continue; // too old, drop it

      seen.add(key);
      const ageMin = Math.max(0, Math.round((Date.now() - data.ts)/60000));
      const popupHtml = '<b>' + escapeHtml(data.name) + '</b> (' + data.role + ')<br>last seen ' +
        (ageMin === 0 ? 'just now' : ageMin + 'm ago');

      if(otherMarkers[key]){
        otherMarkers[key].setLatLng([data.lat, data.lng]);
        otherMarkers[key].setPopupContent(popupHtml);
      } else {
        otherMarkers[key] = L.circleMarker([data.lat, data.lng], {
          radius: 8, color:'#fff', weight:2,
          fillColor: data.role === 'tagger' ? '#d1352f' : '#1f6fb2',
          fillOpacity: 0.95
        }).addTo(map).bindPopup(popupHtml);
      }
    }

    // remove markers for players no longer present/stale
    Object.keys(otherMarkers).forEach(key => {
      if(!seen.has(key)){
        map.removeLayer(otherMarkers[key]);
        delete otherMarkers[key];
      }
    });
  }catch(e){ console.error('refresh failed', e); }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
