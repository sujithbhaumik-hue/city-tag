<style>
  :root{
    --ink:#14181f;

    --tagger-dark:#a11f1a;
    --runner:#2277c4;
    --runner-dark:#144a78;
    --amber:#f2a900;
    --line:#dcd7cb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{

    color:var(--ink);

    font-weight:400;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

    height:8px;
    background:repeating-linear-gradient(45deg, var(--amber) 0 10px, var(--ink) 10px 20px);
  }

  .role-btn.active[data-role="runner"]{border-color:var(--runner); background:#eaf3fb; color:var(--runner-dark); box-shadow:3px 3px 0 var(--runner);}
  .role-btn.active[data-role="tagger"]:hover{box-shadow:5px 6px 0 var(--tagger);}
  .role-btn.active[data-role="runner"]:hover{box-shadow:5px 6px 0 var(--runner);}
  #startBtn{
    width:100%; margin-top:22px; padding:15px; border:3px solid var(--ink); border-radius:11px;
    background:var(--amber); color:var(--ink); font-weight:800; font-size:17px; letter-spacing:.3px;
    cursor:pointer; box-shadow:4px 4px 0 var(--ink); transition:transform .15s, box-shadow .15s;

  #startBtn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink);}

  }

    background:rgba(244,242,236,.97); border-radius:12px; padding:10px 14px;

// this lets us shade everything OUTSIDE the boundary in red.
const OUTER_RING = [
  [-38.3, 144.3],
  [-38.3, 145.6],

/* ---------- Timing ---------- */
const PUSH_INTERVAL = { runner: 5 * 60 * 1000, tagger: 10 * 60 * 1000 };
const POLL_INTERVAL = 20 * 1000;       // how often we refresh the map from shared storage
const STALE_AFTER   = 25 * 60 * 1000;  // hide a player if unseen this long

/* ---------- State ---------- */
let myRole = 'tagger';
let myName = '';
let myId = '';           // now the Firebase Auth UID — stable across devices/browsers
let myCurrentPos = null;    // latest raw GPS reading (kept fresh locally)
let map, boundaryLayer, meMarker;
const otherMarkers = {};    // id -> L.marker
let nextPushAt = 0;

/* ---------- Auth ---------- */
document.getElementById('googleSignInBtn').addEventListener('click', () => {
  auth.signInWithPopup(googleProvider).catch(e => {
    document.getElementById('setupError').textContent = 'Sign-in failed: ' + e.message;
  });
});
document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  if(user){
    myId = user.uid;
    document.getElementById('signedOutView').style.display = 'none';
    document.getElementById('signedInView').style.display = 'block';
    document.getElementById('accountName').textContent = user.displayName || user.email || 'Signed in';
    const nameField = document.getElementById('nameInput');
    if(!nameField.value) nameField.value = (user.displayName || '').split(' ')[0] || '';
    // keep a lightweight profile record so we can look up display names later if needed
    db.ref('users/' + user.uid + '/profile').update({
      name: user.displayName || '', lastSeen: Date.now()
    });
  } else {
    myId = '';
    document.getElementById('signedOutView').style.display = 'block';
    document.getElementById('signedInView').style.display = 'none';
  }
});

/* ---------- Stats ---------- */
document.getElementById('statsBtn').addEventListener('click', showStats);
document.getElementById('closeStatsBtn').addEventListener('click', () => {
  document.getElementById('statsModal').style.display = 'none';
});
document.getElementById('resetStatsBtn').addEventListener('click', async () => {
  if(!confirm('Reset your stats (games played, tags made, times tagged) back to zero? This can\'t be undone.')) return;
  try{
    await db.ref('users/' + myId + '/stats').set({ gamesPlayed: 0, tagsMade: 0, timesTagged: 0 });
    showStats();
  }catch(e){ console.error('reset failed', e); }
});
async function showStats(){
  const body = document.getElementById('statsBody');
  document.getElementById('statsModal').style.display = 'flex';
  body.textContent = 'Loading…';
  try{
    const snap = await db.ref('users/' + myId + '/stats').once('value');
    const s = snap.val() || {};
    body.innerHTML =
      'Games played: <b>' + (s.gamesPlayed || 0) + '</b><br>' +
      'Tags made (as tagger): <b>' + (s.tagsMade || 0) + '</b><br>' +
      'Times tagged (as runner): <b>' + (s.timesTagged || 0) + '</b>';
  }catch(e){
    body.textContent = 'Could not load stats.';
  }
}

/* ---------- Setup screen wiring ---------- */
document.querySelectorAll('.role-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    myRole = btn.dataset.role;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame(){
  const nameField = document.getElementById('nameInput');
  const err = document.getElementById('setupError');
  myName = nameField.value.trim();
  if(!myId){
    err.textContent = 'Sign in first so your stats are saved.';
    return;
  }
  if(!myName){
    err.textContent = 'Enter a name so others can spot you on the grid.';
    return;
  }
  if(!('geolocation' in navigator)){
    err.textContent = 'This browser has no location support — try a phone browser.';
    return;
  }

  // myId is now the Google UID — same across every device you sign into.
  // Only the push-timer history is per-role, since switching role changes your cadence.
  const savedRole = localStorage.getItem('cityTagRole');
  if(savedRole !== myRole) localStorage.removeItem('cityTagLastPush');
  localStorage.setItem('cityTagName', myName);
  localStorage.setItem('cityTagRole', myRole);

  db.ref('users/' + myId + '/stats/gamesPlayed').transaction(v => (v || 0) + 1);

  document.getElementById('setup').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('legend').style.display = 'block';
  document.getElementById('styleSwitch').style.display = 'flex';
  document.getElementById('meName').textContent = myName;
  const pill = document.getElementById('mePill');
  pill.textContent = myRole;
  pill.className = 'pill ' + myRole;

  initMap();
  watchLocation();
  scheduleNextPush();
  setInterval(refreshOthers, POLL_INTERVAL);
  setInterval(tickCountdown, 1000);
  refreshOthers();
}

document.getElementById('endGameBtn').addEventListener('click', async () => {
  if(!confirm("End the game and leave? You'll go back to the start screen — pick a fresh role if you want to play again.")) return;
  try{
    await db.ref('players/' + myId).remove(); // stop showing on everyone else's map
  }catch(e){ console.error('leave failed', e); }
  location.reload(); // simplest reliable way to stop all timers/GPS watchers and reset to setup
});

// Prefill the setup form if this browser has played before — saves re-typing your name.
window.addEventListener('DOMContentLoaded', () => {
  const savedName = localStorage.getItem('cityTagName');
  const savedRole = localStorage.getItem('cityTagRole');
  if(savedName) document.getElementById('nameInput').value = savedName;
  if(savedRole){
    myRole = savedRole;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === savedRole));
  }
});


/* ---------- Map ---------- */
let currentBaseLayer;
const BASE_LAYERS = {
  clean: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }),
  standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  })
};

function setMapStyle(style){
  if(currentBaseLayer) map.removeLayer(currentBaseLayer);
  currentBaseLayer = BASE_LAYERS[style];
  currentBaseLayer.addTo(map);
  document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === style));
}

let trainLayer = null;
function lightenColor(hex, amount){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  r = Math.round(r + (255-r)*amount); g = Math.round(g + (255-g)*amount); b = Math.round(b + (255-b)*amount);
  return `rgb(${r},${g},${b})`;
}

function toggleTrainLines(){
  const btn = document.getElementById('trainToggleBtn');
  if(trainLayer){
    map.removeLayer(trainLayer);
    trainLayer = null;
    btn.classList.remove('active');
    return;
  }
  trainLayer = L.layerGroup();

  // Draw each line's real physical track segments, sourced from OpenStreetMap.
  // Thicker base weight, with a lighter "glow" + name tooltip on hover.
  Object.values(REAL_TRACKS).forEach(line => {
    line.segments.forEach(seg => {
      const pl = L.polyline(seg, {
        color: line.color, weight: 6, opacity: 0.88, lineCap: 'round', lineJoin: 'round'
      }).addTo(trainLayer);
      pl.bindTooltip(line.name, { sticky: true, className: 'track-tooltip' });
      pl.on('mouseover', function(){
        this.setStyle({ weight: 9, opacity: 1, color: lightenColor(line.color, 0.4) });
        this.bringToFront();
      });
      pl.on('mouseout', function(){
        this.setStyle({ weight: 6, opacity: 0.88, color: line.color });
      });
    });
  });

  // Station dots with permanent name labels
  Object.values(STATIONS).forEach(s => {
    L.circleMarker(s.pos, { radius: 5, color: '#fff', weight: 2, fillColor: '#222', fillOpacity: 1 })
      .addTo(trainLayer)
      .bindTooltip(s.name, { permanent: true, direction: 'right', offset: [7, 0], className: 'station-label' });
  });

  trainLayer.addTo(map);
  btn.classList.add('active');
}

function initMap(){
  map = L.map('map', { zoomControl: true }).setView(CENTER, 15);
  setMapStyle('clean'); // closest free look to Apple Maps' light style

  // Outer ring + inner BOUNDARY ring = a polygon with a hole, so only the
  // "not allowed" area outside the boundary gets the red tint.
  boundaryLayer = L.polygon([OUTER_RING, BOUNDARY], {
    color: '#d1352f', weight: 3, fillColor: '#d1352f', fillOpacity: 0.16
  }).addTo(map);
}

function pointInBoundary(lat, lng){
  // ray-casting, BOUNDARY is [lat,lng] pairs
  let inside = false;
  for(let i=0, j=BOUNDARY.length-1; i<BOUNDARY.length; j=i++){
    const yi = BOUNDARY[i][0], xi = BOUNDARY[i][1];
    const yj = BOUNDARY[j][0], xj = BOUNDARY[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

/* ---------- My live GPS (local only — doesn't push every tick) ---------- */
function watchLocation(){
  navigator.geolocation.watchPosition(
    pos => {
      myCurrentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      drawMe();
    },
    error => {
      document.getElementById('boundsStatus').textContent = 'Location error: ' + error.message;
    },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}

function drawMe(){
  if(!myCurrentPos) return;
  const {lat, lng} = myCurrentPos;
  if(!meMarker){
    const icon = L.divIcon({
      className: '',
      html: '<div class="me-marker-wrap"><div class="me-marker-ring"></div><div class="me-marker-dot"></div></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
    meMarker = L.marker([lat,lng], { icon }).addTo(map).bindPopup('<b>' + myName + '</b> (you)');
    map.setView([lat,lng], 16);
  } else {
    meMarker.setLatLng([lat,lng]);
  }
  const inside = pointInBoundary(lat, lng);
  const statusEl = document.getElementById('boundsStatus');
  statusEl.textContent = inside ? '✅ Inside the boundary' : '⚠️ Outside the boundary!';
  statusEl.className = inside ? 'in' : 'out';
}

/* ---------- Pushing my location on my role's blip interval ---------- */
/* The clock is based on real elapsed time since the last push (stored in
   localStorage), not an in-memory countdown — so closing the browser doesn't
   reset it. Reopening after the interval has already passed blips immediately;
   reopening early just resumes the remaining countdown. */
function scheduleNextPush(){
  const interval = PUSH_INTERVAL[myRole];
  const lastPush = Number(localStorage.getItem('cityTagLastPush') || 0);
  const due = lastPush + interval;
  const now = Date.now();

  if(now >= due){
    nextPushAt = now; // overdue (or first-ever push) — fire immediately once we have a GPS fix
    firePushWhenReady();
  } else {
    nextPushAt = due;
    setTimeout(() => { firePushWhenReady(); }, due - now);
  }
}

function firePushWhenReady(){
  // If GPS hasn't returned a fix yet, keep checking briefly rather than losing the push.
  if(!myCurrentPos){
    setTimeout(firePushWhenReady, 1000);
    return;
  }
  pushMyLocation().then(() => {
    localStorage.setItem('cityTagLastPush', String(Date.now()));
    scheduleNextPush(); // queue the next one from this real push time
  });
}

async function pushMyLocation(){
  if(!myCurrentPos) return;
  try{
    await db.ref('players/' + myId).set({
      name: myName, role: myRole,
      lat: myCurrentPos.lat, lng: myCurrentPos.lng,
      ts: Date.now()
    });
  }catch(e){ console.error('push failed', e); }
}

function tickCountdown(){
  const secs = Math.max(0, Math.round((nextPushAt - Date.now())/1000));
  const m = Math.floor(secs/60), s = secs%60;
  document.getElementById('nextPush').innerHTML =
    '<span class="live-dot"></span>next blip in ' + m + 'm ' + String(s).padStart(2,'0') + 's';
}

/* ---------- Reading everyone else from shared storage ---------- */
async function refreshOthers(){
  try{
    const snap = await db.ref('players').once('value');
    const all = snap.val();
    if(!all) return;

    // Check if someone tagged ME — my own entry's role may have changed server-side.
    const mine = all[myId];
    if(mine && mine.role && mine.role !== myRole){
      handleBeingTagged(mine.role);
    }

    const wanted = myRole === 'tagger' ? 'runner' : 'tagger'; // see the opposing role
    const seen = new Set();

    for(const [id, data] of Object.entries(all)){
      const key = 'player:' + id;
      if(id === myId) continue;
      if(!data || data.role !== wanted) continue;
      if(Date.now() - data.ts > STALE_AFTER) continue; // too old, drop it

      seen.add(key);
      const ageMin = Math.max(0, Math.round((Date.now() - data.ts)/60000));
      let popupHtml = '<b>' + escapeHtml(data.name) + '</b> (' + data.role + ')<br>last seen ' +
        (ageMin === 0 ? 'just now' : ageMin + 'm ago');
      // Only taggers get a Tag button, and only on runners.
      if(myRole === 'tagger' && data.role === 'runner'){
        popupHtml += '<br><button class="tag-btn" onclick="tagPlayer(\'' + id + '\')">Tag ' + escapeHtml(data.name) + '</button>';
      }

      if(otherMarkers[key]){
        otherMarkers[key].setLatLng([data.lat, data.lng]);
        otherMarkers[key].setPopupContent(popupHtml);
      } else {
        otherMarkers[key] = L.circleMarker([data.lat, data.lng], {
          radius: 8, color:'#fff', weight:2,
          fillColor: data.role === 'tagger' ? '#d1352f' : '#1f6fb2',
          fillOpacity: 0.95
        }).addTo(map).bindPopup(popupHtml);
      }
    }

    // remove markers for players no longer present/stale
    Object.keys(otherMarkers).forEach(key => {
      if(!seen.has(key)){
        map.removeLayer(otherMarkers[key]);
        delete otherMarkers[key];
      }
    });
  }catch(e){ console.error('refresh failed', e); }
}

/* ---------- Tagging: a tagger flips a runner's role to 'tagger' for everyone ---------- */
async function tagPlayer(targetId){
  try{
    await db.ref('players/' + targetId).update({ role: 'tagger' });
    db.ref('users/' + myId + '/stats/tagsMade').transaction(v => (v || 0) + 1);
    map.closePopup();
    showBanner('Tagged! They\'re a tagger now.');
    refreshOthers();
  }catch(e){ console.error('tag failed', e); }
}

function handleBeingTagged(newRole){
  myRole = newRole;
  localStorage.setItem('cityTagRole', myRole);
  if(newRole === 'tagger'){
    db.ref('users/' + myId + '/stats/timesTagged').transaction(v => (v || 0) + 1);
  }
  const pill = document.getElementById('mePill');
  pill.textContent = myRole;
  pill.className = 'pill ' + myRole;
  showBanner(myRole === 'tagger' ? "You've been tagged! You're now a tagger." : "You're now a runner.");
  scheduleNextPush(); // your blip interval just changed
}

function showBanner(text){
  let el = document.getElementById('flashBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'flashBanner';
    el.className = 'stamp';
    el.style.cssText = 'position:fixed;top:20px;left:50%;z-index:3000;'
      + 'background:var(--tagger);color:#fff;padding:12px 22px;border-radius:8px;'
      + 'box-shadow:4px 4px 0 var(--ink);text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.display = 'block';
  el.style.animation = 'none';
  void el.offsetWidth; // restart animation on repeat triggers
  el.style.animation = '';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
